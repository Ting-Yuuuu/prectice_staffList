<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/staff_list.css">
  <script src="https://kit.fontawesome.com/224e3a1241.js" crossorigin="anonymous"></script>
  <title>員工列表</title>
</head>
<body>
  <header>
    <a href="./index.html">
      <img src="../image/logo_pic.png" alt="" width="50">
      <h2 class="header_text">Hopper</h2>
    </a>
  </header>
  <div class="wrapper">
    <!-- 麵包屑 -->
    <div class="breadcrumb_block">
      <p class="breadcrumb">首頁</p>
      <p class="breadcrumb">></p>
      <p class="breadcrumb">全體員工資料表</p>
    </div>
    
    <!-- 標題 -->
    <div class="title_block">
      <h2 class="title">全體員工資料表</h2>
    </div>

    <!-- 搜尋區塊 -->
    <div class="search_block">
      <div class="search">
        <label for="">所屬部門</label>
        <select name="" id="" class="dropdown">
          <option value="">-請選擇-</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="search">
        <label for="">工作職稱</label>
        <select name="" id="" class="dropdown">
          <option value="">-請選擇-</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <div class="search">
        <label for="">搜尋</label>
        <input type="text" class="" placeholder="請輸入內容">
      </div>
      <div class="add_block">
        <button class="add_btn">新增資料</button>
        <div class="data_block">
          <div class="data">
            <p>資料筆數：</p>
            <p>13</p>
          </div>
          <div class="page">
            <i class="fa-regular fa-circle-left"></i>
            <p>1/1</p>
            <i class="fa-regular fa-circle-right"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- 表格 -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>所屬部門</th>
          <th>工作職稱</th>
          <th>員工姓名</th>
          <th>電子信箱</th>
          <th>手機號碼</th>
          <th>出生年月日</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><a href="../html/edit_staff.html">1</a></td>
          <td>2</td>
          <td>3</td>
          <td>4</td>
          <td>5</td>
          <td>6</td>
          <td>7</td>
          <td>8</td>
        </tr>
      </tbody>
    </table>
      
  </div>
</body>
</html>

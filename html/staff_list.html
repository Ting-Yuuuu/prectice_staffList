<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/staff_list.css">
  <script src="../js/staff_list.js"></script>
  <script src="https://kit.fontawesome.com/224e3a1241.js" crossorigin="anonymous"></script>
  <title>員工列表</title>
</head>
<body>
  <header>
    <a href="./index.html">
      <img src="../image/logo_pic.png" alt="" width="50">
      <h2 class="header_text">Hopper</h2>
    </a>
  </header>
  <div class="wrapper">
    <!-- 麵包屑 -->
    <div class="breadcrumb_block">
      <a href="./index.html" class="breadcrumb">首頁</a>
      <a class="breadcrumb">></a>
      <a href="./staff_list.html" class="breadcrumb">全體員工資料表</a>
    </div>
    
    <!-- 標題 -->
    <div class="title_block">
      <h2 class="title">全體員工資料表</h2>
    </div>

    <!-- 搜尋區塊 -->
    <div class="search_block">
      <div class="search_first_block">
        <div class="search">
          <label for="">所屬部門</label>
          <select name="" id="" class="dropdown">
            <option value="">-請選擇-</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
        <div class="search">
          <label for="">工作職稱</label>
          <select name="" id="" class="dropdown">
            <option value="">-請選擇-</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
      </div>
      <div class="search_second_block">
        <div class="search">
          <label for="">搜尋</label>
          <input type="text" class="" placeholder="請輸入內容">
        </div>
        <div class="add_block">
          <a href="./add_staff.html" class="add_btn">新增資料</a>
          <div class="data_block">
            <div class="data">
              <p>資料筆數：</p>
              <p class="total_list"></p>
            </div>
            <div class="page">
              <i class="fa-regular fa-circle-left"></i>
              <p>1/1</p>
              <i class="fa-regular fa-circle-right"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 表格 -->
    <div class="table_block">
      <table class="staff_table">
        <thead>
          <tr>
            <th>ID</th>
            <th>所屬部門</th>
            <th>工作職稱</th>
            <th>員工姓名</th>
            <th>電子信箱</th>
            <th>手機號碼</th>
            <th>出生年月日</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <!-- 從js加入 -->
        </tbody>
      </table>
    </div>
      
  </div>
</body>
</html>

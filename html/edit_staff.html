<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/edit_staff.css">
  <title>編輯員工資料</title>
</head>
<body>
  <header>
    <a href="./index.html">
      <img src="../image/logo_pic.png" alt="" width="50">
      <h2 class="header_text">Hopper</h2>
    </a>
  </header>
  <div class="wrapper">
    <!-- 麵包屑 -->
    <div class="breadcrumb_block">
      <p class="breadcrumb">首頁</p>
      <p class="breadcrumb">></p>
      <p class="breadcrumb">全體員工資料表</p>
      <p class="breadcrumb">></p>
      <p class="breadcrumb">編輯員工資料</p>
    </div>
    
    <!-- 標題 -->
    <div class="title_block">
      <h2 class="title">編輯員工資料</h2>
    </div>

    <!-- 內容區 -->
    <form class="content">
      <div class="two_block">
        <div class="information">
          <label for="">*ID</label>
          <input type="text" class="" placeholder="001" disabled>
          <p class="hint">*ID無法變更</p>
        </div>
        <div class="information">
          <label for="">*所屬部門</label>
          <select name="" id="">
            <option value="">-請選擇-</option>
            <option value="">1</option>
            <option value="">2</option>
          </select>
          <p class="hint">*必填</p>
        </div>
      </div>
      <div class="two_block">
        <div class="information">
          <label for="">*員工職務</label>
          <input type="text" class="" placeholder="請輸入職務" >
          <p class="hint">*必填</p>
        </div>
        <div class="information">
          <label for="">*員工姓名</label>
          <input type="text" class="" placeholder="請輸入姓名" >
          <p class="hint">*必填</p>
        </div>
      </div>
      <div class="two_block">
        <div class="information">
          <label for="">*電子信箱</label>
          <input type="text" class="" placeholder="請輸入電子信箱" >
          <p class="hint">*必填 格式為xxxxx@xxxxx.com</p>
        </div>
        <div class="information">
          <label for="">*手機號碼</label>
          <input type="text" class="" placeholder="請輸入手機號碼" >
          <p class="hint">*必填</p>
        </div>
      </div>
      <div class="information">
        <label for="">*出生年月日</label>
        <input type="date" class="date" placeholder="" >
          <p class="hint">*必填</p>
      </div>
    </form>
    <div class="btn_block">
      <button class="submit">送出</button>
      <button class="cancel">取消</button>
    </div>
  </div>
</body>
</html>
